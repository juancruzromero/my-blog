{% load wagtailcore_tags %}

<aside class="space-y-8">
    <!-- Categorias -->
    <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-semibold mb-4 text-gray-900">Categorias</h3>
        <ul class="space-y-2">
            <li>
                <a href="/blog/?category=viajes"
                   class="flex items-center text-gray-600 hover:text-primary transition-colors">
                    <span class="w-3 h-3 rounded-full mr-3" style="background-color: #10B981"></span>
                    Viajes
                </a>
            </li>
            <li>
                <a href="/blog/?category=tecnologia"
                   class="flex items-center text-gray-600 hover:text-primary transition-colors">
                    <span class="w-3 h-3 rounded-full mr-3" style="background-color: #3B82F6"></span>
                    Tecnologia
                </a>
            </li>
            <li>
                <a href="/blog/?category=trenes"
                   class="flex items-center text-gray-600 hover:text-primary transition-colors">
                    <span class="w-3 h-3 rounded-full mr-3" style="background-color: #F59E0B"></span>
                    Hablemos de Trenes
                </a>
            </li>
            <li>
                <a href="/blog/?category=otros"
                   class="flex items-center text-gray-600 hover:text-primary transition-colors">
                    <span class="w-3 h-3 rounded-full mr-3" style="background-color: #6B7280"></span>
                    Otros
                </a>
            </li>
        </ul>
    </div>

    <!-- Espacio para publicidad -->
    <div class="bg-gray-100 rounded-lg p-6 text-center">
        <p class="text-gray-400 text-sm">Espacio publicitario</p>
        <div class="mt-2 bg-gray-200 rounded h-64 flex items-center justify-center">
            <span class="text-gray-400">300x250</span>
        </div>
    </div>

    <!-- Newsletter -->
    <div class="bg-primary rounded-lg shadow-md p-6 text-white">
        <h3 class="text-lg font-semibold mb-2">Newsletter</h3>
        <p class="text-sm mb-4 opacity-90">
            Recibe las ultimas publicaciones en tu email.
        </p>
        <form class="space-y-3">
            <input type="email"
                   placeholder="tu@email.com"
                   class="w-full px-4 py-2 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white">
            <button type="submit"
                    class="w-full bg-white text-primary py-2 rounded-lg font-medium hover:bg-gray-100 transition-colors">
                Suscribirse
            </button>
        </form>
    </div>
</aside>
